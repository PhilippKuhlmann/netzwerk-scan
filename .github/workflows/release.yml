# Pushing a tag like v1.2.0 builds the EXE and publishes it as a release.
# Every installed copy picks up that release the next time it starts.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test -c Release --nologo

      - name: Build EXE
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          dotnet publish src/NetzwerkScan -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none `
            -p:Version=$version -o dist --nologo

      - name: Write checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/NetzwerkScan.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content dist/NetzwerkScan.exe.sha256 "$hash  NetzwerkScan.exe" -NoNewline

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/NetzwerkScan.exe dist/NetzwerkScan.exe.sha256 --generate-notes
